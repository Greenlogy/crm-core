<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400&display=swap"><style>
body{margin:0;font-family:Geist,system-ui,sans-serif;color:var(--ink);background:var(--surface-page);-webkit-font-smoothing:antialiased}
.card{margin:var(--space-5);background:var(--surface-card);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-card);padding:var(--space-2) var(--space-5)}
table{width:100%;border-collapse:collapse;font:400 14px/20px Geist,system-ui,sans-serif}
th{font:500 12px/16px Geist,system-ui,sans-serif;letter-spacing:.04em;color:var(--ink-muted);text-align:left;padding:12px 8px;border-bottom:1px solid var(--border-strong)}
td{padding:12px 8px;border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface-muted)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.name{display:flex;gap:10px;align-items:center;font-weight:600}
.av{width:28px;height:28px;border-radius:var(--radius-sm);background:var(--brand-tint);color:var(--brand-text);font:600 11px/28px Geist,sans-serif;text-align:center}
.eic{font:400 13px/18px "Geist Mono",ui-monospace,monospace;color:var(--ink-muted)}
.pill{font:500 12px/16px Geist,system-ui,sans-serif;border-radius:var(--radius-pill);padding:3px 10px}
.pos{background:var(--positive-tint);color:var(--positive-strong)}.neu{background:var(--surface-muted);color:var(--ink-muted)}
</style></head><body><div id="root" class="card"><table>
<thead><tr><th>Zákazník</th><th>EIC</th><th>Stav</th><th class="num">Spotreba MWh</th><th class="num">Cena €/MWh</th></tr></thead>

<tr><td><div class="name"><span class="av">ZP</span>Žilinská pekáreň s.r.o.</div></td><td class="eic">24ZSS4100045210K</td><td><span class="pill pos">Aktívne</span></td><td class="num">412,6</td><td class="num">98,40</td></tr>
<tr><td><div class="name"><span class="av">KV</span>Kovovýroba Váh a.s.</div></td><td class="eic">24ZSS4100078132P</td><td><span class="pill pos">Aktívne</span></td><td class="num">1 860,2</td><td class="num">SPOT + 17,42</td></tr>
<tr><td><div class="name"><span class="av">HD</span>Hotel Diana</div></td><td class="eic">24ZSS4100011907M</td><td><span class="pill neu">Neaktívne</span></td><td class="num">96,0</td><td class="num">104,00</td></tr>
</tbody></table></div><script>/* statický náhľad, vymyslené údaje */</script></body></html>
