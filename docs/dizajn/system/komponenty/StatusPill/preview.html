<!-- @dsCard group="Stav" height=120 subtitle="Stav záznamu, plnenie, SLA" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400&display=swap"><style>
body{margin:0;font-family:Geist,system-ui,sans-serif;color:var(--ink);background:var(--surface-page);-webkit-font-smoothing:antialiased}
.row{display:flex;gap:var(--space-2);align-items:center;padding:var(--space-5);flex-wrap:wrap;background:var(--surface-card)}
.pill{font:500 12px/16px Geist,system-ui,sans-serif;border-radius:var(--radius-pill);padding:3px 10px;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.pos{background:var(--positive-tint);color:var(--positive-strong)}
.neg{background:var(--negative-tint);color:var(--negative)}
.warn{background:var(--warning-tint);color:var(--warning)}
.info{background:var(--info-tint);color:var(--info)}
.neu{background:var(--surface-muted);color:var(--ink-muted)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor}
</style></head><body><div id="root" class="row">
<span class="pill pos"><span class="dot"></span>Aktívne</span>
<span class="pill neu">Neaktívne</span>
<span class="pill neg">Odídené</span>
<span class="pill warn"><span class="dot"></span>SLA o 2 h</span>
<span class="pill neg">SLA po termíne</span>
<span class="pill pos">115 %</span>
<span class="pill neg">49 %</span>
<span class="pill info">Odoslaná</span>
<span class="pill neu">Koncept</span>
</div><script>/* statický náhľad */</script></body></html>
