<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400&display=swap"><style>
body{margin:0;font-family:Geist,system-ui,sans-serif;color:var(--ink);background:var(--surface-page);-webkit-font-smoothing:antialiased}
.row{display:flex;gap:var(--space-2);align-items:center;padding:var(--space-5);flex-wrap:wrap}
.btn{font:500 14px/20px Geist,system-ui,sans-serif;border-radius:var(--radius-md);padding:9px 16px;border:1px solid var(--border);background:var(--surface-card);color:var(--ink);cursor:pointer;display:inline-flex;gap:8px;align-items:center;box-shadow:var(--shadow-card)}
.btn:hover{border-color:var(--border-strong)}
.btn:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}
.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.primary:hover{background:var(--brand-hover);border-color:var(--brand-hover)}
.ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--brand-text)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.5}
</style></head><body><div id="root" class="row">
<button class="btn primary"><svg viewBox="0 0 24 24"><path d="M12 4v12m0 0l-5-5m5 5l5-5M5 20h14"/></svg>Odoslať ponuku</button>
<button class="btn">Day View →</button>
<button class="btn">Uložiť koncept</button>
<button class="btn ghost">Zobraziť v Cockpite →</button>
<button class="btn" disabled>Neaktívne</button>
</div><script>/* statický náhľad */</script></body></html>
