<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400&display=swap"><style>
body{margin:0;font-family:Geist,system-ui,sans-serif;color:var(--ink);background:var(--surface-page);-webkit-font-smoothing:antialiased}
.side{width:264px;background:var(--surface-sidebar);border-right:1px solid var(--border);padding:var(--space-4) var(--space-3);box-sizing:border-box;min-height:280px}
.logo{display:flex;gap:10px;align-items:center;padding:4px 8px 16px}
.mark{width:32px;height:32px;border-radius:var(--radius-md);background:var(--brand);display:grid;place-items:center}
.mark svg{width:18px;height:18px;stroke:var(--on-brand);fill:none;stroke-width:2}
.n{font:600 15px/18px Geist,sans-serif}.s{font:400 12px/16px Geist,sans-serif;color:var(--ink-muted)}
.grp{font:400 12px/16px Geist,sans-serif;color:var(--ink-muted);padding:12px 12px 6px}
a{display:flex;gap:12px;align-items:center;padding:9px 12px;border-radius:var(--radius-md);color:var(--ink);text-decoration:none;font:400 15px/20px Geist,sans-serif}
a:hover{background:var(--surface-muted)}
a.on{background:var(--surface-muted);font-weight:600}
a:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}
a svg{width:18px;height:18px;stroke:var(--ink-muted);fill:none;stroke-width:1.5}
.badge{margin-left:auto;font:500 12px/16px Geist,sans-serif;background:var(--negative-tint);color:var(--negative);border-radius:var(--radius-pill);padding:1px 8px}
</style></head><body><nav id="root" class="side">
<div class="logo"><span class="mark"><svg viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg></span><div><div class="n">Greenlogy</div><div class="s">CRM</div></div></div>
<div class="grp">Obchod</div>
<a href="#"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Prehľad</a>
<a href="#" class="on"><svg viewBox="0 0 24 24"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 9h1m4 0h1M9 13h1m4 0h1M9 17h1m4 0h1"/></svg>Firmy</a>
<a href="#"><svg viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>Odberné miesta</a>
<div class="grp">Servis</div>
<a href="#"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 01-11.6 7.1L4 20l1-4.4A8 8 0 1121 12z"/></svg>Konverzácie<span class="badge">3 po SLA</span></a>
</nav><script>/* statický náhľad */</script></body></html>
