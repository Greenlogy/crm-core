<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 320" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
<!--
  Greenlogy CRM – krajina do hlavičky (schválená, NEMENIŤ tvary ani farby).
  Vkladajte INLINE do <section class="gl-hero">, absolútne cez celú plochu:
    position:absolute; inset:0; width:100%; height:100%
  Pozadie sekcie: token gl-hero-sky z tokens.css. Lopatky turbín sa otáčajú cez triedu .gl-spin
  (kľúčové snímky a prefers-reduced-motion sú v styles/components.css).
  Ak sa vkladá viackrát na jednej stránke, premenujte id gradientov (a*), aby boli unikátne.
-->
<defs>
<radialGradient id="aSunGlow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffd27a" stop-opacity=".75"/><stop offset=".45" stop-color="#ffd27a" stop-opacity=".25"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></radialGradient>
<linearGradient id="aSun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe2a0"/><stop offset="1" stop-color="#f2b443"/></linearGradient>
<linearGradient id="aH1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe3cd"/><stop offset="1" stop-color="#e3f1e6"/></linearGradient>
<linearGradient id="aH2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6cc79a"/><stop offset="1" stop-color="#3f9c70"/></linearGradient>
<linearGradient id="aH3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1f7a54"/><stop offset="1" stop-color="#0f3d2b"/></linearGradient>
<linearGradient id="aPv" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7fa6f2"/><stop offset="1" stop-color="#2f62c8"/></linearGradient>
<pattern id="aDots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#1a6b4a" fill-opacity=".10"/></pattern>
</defs>
<rect width="1300" height="200" fill="url(#aDots)"/>
<circle cx="650" cy="168" r="170" fill="url(#aSunGlow)"/>
<circle cx="650" cy="168" r="54" fill="url(#aSun)"/>
<path d="M0 214 C 260 150, 470 196, 650 166 S 1040 132, 1300 176 L1300 320 L0 320 Z" fill="url(#aH1)"/>
<g stroke="#ffffff" stroke-linecap="round" fill="none">
<line x1="540" y1="182" x2="540" y2="118" stroke-width="2.5"/>
<g class="gl-spin" style="transform-origin: 540px 118px; transform-box: view-box;" fill="#ffffff" stroke="none"><path d="M540 118 L537 92 Q540 86 543 92 Z"/><path d="M540 118 L563 130 Q565 136 559 135 Z"/><path d="M540 118 L517 130 Q515 136 521 135 Z"/></g>
<circle cx="540" cy="118" r="3.5" fill="#ffffff" stroke="none"/>
<line x1="762" y1="164" x2="762" y2="94" stroke-width="2.5"/>
<g class="gl-spin" style="transform-origin: 762px 94px; transform-box: view-box; animation-duration: 11s;" fill="#ffffff" stroke="none"><path d="M762 94 L759 66 Q762 60 765 66 Z"/><path d="M762 94 L787 107 Q789 113 783 112 Z"/><path d="M762 94 L737 107 Q735 113 741 112 Z"/></g>
<circle cx="762" cy="94" r="3.5" fill="#ffffff" stroke="none"/>
<line x1="836" y1="160" x2="836" y2="116" stroke-width="2"/>
<g class="gl-spin" style="transform-origin: 836px 116px; transform-box: view-box; animation-duration: 8s;" fill="#ffffff" stroke="none"><path d="M836 116 L834 98 Q836 94 838 98 Z"/><path d="M836 116 L852 124 Q853 128 849 128 Z"/><path d="M836 116 L820 124 Q819 128 823 128 Z"/></g>
</g>
<path d="M0 252 C 240 214, 460 262, 690 226 S 1080 196, 1300 236 L1300 320 L0 320 Z" fill="url(#aH2)"/>
<g><rect x="876" y="200" width="52" height="22" rx="4" transform="skewX(-18)" fill="url(#aPv)"/><rect x="936" y="194" width="52" height="22" rx="4" transform="skewX(-18)" fill="url(#aPv)"/><rect x="996" y="188" width="52" height="22" rx="4" transform="skewX(-18)" fill="url(#aPv)"/></g>
<path d="M0 284 C 280 256, 560 302, 860 274 S 1180 262, 1300 278 L1300 320 L0 320 Z" fill="url(#aH3)"/>
</svg>
